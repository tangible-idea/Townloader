name = "townloader"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Poe 봇 이름. poe.com 에서 쓰려는 봇 이름으로 바꾼다.
POE_MODEL = "Claude-Sonnet-4.5"
DAILY_LIMIT = "30"

# 요약 캐시와 하루 제한 카운터.
# `npx wrangler kv namespace create SUMMARIES` 로 만든 namespace.
[[kv_namespaces]]
binding = "SUMMARIES"
id = "63bf1da5d5b4438db7efee51cee60f08"

# 비밀값은 여기에 쓰지 않고 `npx wrangler secret put <이름>` 으로 넣는다:
#   ANTHROPIC_API_KEY, POE_API_KEY, HIKER_API_KEY, APP_TOKEN

# HikerAPI 조회의 IP 별 분당 제한. namespace_id 는 계정 안에서 겹치지 않는 아무 숫자.
[[ratelimits]]
name = "HIKER_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
